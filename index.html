<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>趕課大作戰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a compact scoreboard strip on top, the campus map as the stage, and a live dock board (like the bike app) underneath. */
:root{
  --bg:#EEF3EC; --panel:#FFFFFF; --fg:#1C2530; --muted:#5E6B76; --line:#D3DCD3;
  --accent:#F2B600; --accent-ink:#1C2530; --danger:#D6334B; --ok:#2E8B57; --dock:#C9D2CB;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Chakra Petch","Noto Sans TC",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131A1F; --panel:#1C252C; --fg:#E9EFEA; --muted:#94A3A8; --line:#2C3941;
  --accent:#FFC629; --accent-ink:#1C2530; --danger:#FF6B7F; --ok:#5CC98C; --dock:#3A4850; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131A1F; --panel:#1C252C; --fg:#E9EFEA; --muted:#94A3A8; --line:#2C3941;
  --accent:#FFC629; --accent-ink:#1C2530; --danger:#FF6B7F; --ok:#5CC98C; --dock:#3A4850; color-scheme:dark }

[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:26px;font-weight:900;margin:0;letter-spacing:.02em}
.tag{font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:2px 10px;border-radius:999px}

.hud{display:grid;grid-template-columns:1.3fr 1fr auto auto;gap:16px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.hud > div{min-width:0}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.next strong{font-size:19px;font-weight:900;margin-right:8px}
.next span.place{color:var(--muted);font-weight:500}
.timer{display:flex;flex-direction:column;gap:4px}
.timer .row{display:flex;align-items:baseline;gap:4px}
#time{font-family:var(--font-num);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#time.low{color:var(--danger)}
.unit{font-size:12px;color:var(--muted)}
.bar{height:5px;background:var(--dock);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.mode{font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap;justify-self:start}
.mode.ride{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pips{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.pips li{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;
  font-size:12px;font-weight:900;color:transparent}
.pips li.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pips li.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.pips li.miss{background:var(--danger);border-color:var(--danger);color:#fff}
.side{grid-column:1/-1;font-size:13px;font-weight:500;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.lv b{font-weight:900;font-size:15px}
.lv small{font-size:11.5px;color:var(--muted);line-height:1.35}
.lv[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lv:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stage{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);background:#A8CF9A}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#toast{position:absolute;left:10px;top:10px;max-width:calc(100% - 200px);background:rgba(28,37,48,.92);color:#fff;
  font-weight:700;font-size:14px;padding:7px 12px;border-radius:9px;opacity:0;transform:translateY(-6px);
  transition:opacity .18s,transform .18s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#act{position:absolute;right:max(12px, env(safe-area-inset-right, 0px));bottom:12px;min-width:92px;height:52px;padding:0 16px;
  border-radius:26px;border:2px solid #1C2530;background:#FFC629;color:#1C2530;font:900 16px var(--font-body);cursor:pointer}
#act:disabled{background:rgba(255,255,255,.55);color:rgba(28,37,48,.5);border-color:rgba(28,37,48,.35);cursor:default}
#act:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:rgba(19,26,31,.55)}
.card{background:var(--panel);color:var(--fg);border-radius:14px;padding:22px 24px;max-width:440px;width:100%;
  max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:21px;font-weight:900;line-height:1.35;text-wrap:balance}
.card ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.card .big{font-family:var(--font-num);font-size:40px;font-weight:700;line-height:1}
.card .sub{color:var(--muted);margin:0}
.btn{align-self:flex-start;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);
  font:900 16px var(--font-body);padding:10px 20px;cursor:pointer}

.below{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.below > section{min-width:0}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}
#stnList{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 18px}
#stnList li{display:grid;grid-template-columns:5.2em 1fr auto;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
#stnList li.near .sn{color:var(--fg);font-weight:900}
.sn{font-weight:500;color:var(--muted);white-space:nowrap}
.docks{display:flex;gap:3px;flex-wrap:wrap}
.docks i{width:11px;height:11px;border-radius:3px;border:1.5px solid var(--dock)}
.docks i.b{background:var(--accent);border-color:var(--accent)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.how dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.how dt{font-weight:700;white-space:nowrap}
.how dd{margin:0;color:var(--muted)}
kbd{font-family:var(--font-num);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}

@media (max-width:640px){
  .hud{grid-template-columns:1fr 1fr;gap:10px 14px}
  .stage{aspect-ratio:4/5}
  .below{grid-template-columns:1fr}
  h1{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>趕課大作戰</h1>
    <span class="tag">臺北大學三峽校區・YouBike 關</span>
  </header>

  <section class="hud" aria-live="off">
    <div class="next">
      <span class="lbl">下一堂課</span>
      <strong id="course">尚未開始</strong><span class="place" id="place">選好難度就出發</span>
    </div>
    <div class="timer">
      <div class="row"><span id="time">--.-</span><span class="unit">秒後點名</span></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="mode" id="mode">步行</div>
    <ol class="pips" id="pips" aria-label="出席紀錄"></ol>
    <div class="side" id="side" hidden></div>
  </section>

  <div class="stage" id="stage">
    <canvas id="c" aria-label="校園地圖"></canvas>
    <div id="toast" role="status"></div>
    <button id="act" type="button" disabled>借車</button>
    <div class="overlay" id="overlay">
      <div class="card" id="card"></div>
    </div>
  </div>

  <div class="below">
    <section>
      <h2 class="sec">YouBike 即時車位</h2>
      <ul id="stnList"></ul>
    </section>
    <section class="how">
      <h2 class="sec">操作</h2>
      <dl>
        <dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向鍵</dt><dd>移動。手機在地圖上拖曳。</dd>
        <dt><kbd>E</kbd> / <kbd>空白鍵</kbd></dt><dd>在站點旁借車或還車。</dd>
        <dt>騎車</dt><dd>柏油路上最快，草地會慢下來。</dd>
        <dt>進教室</dt><dd>要先還車，用走的踩上門口。</dd>
      </dl>
    </section>
  </div>
</div>

<script>
(() => {
'use strict';
/* ---------- tuning ---------- */
const WALK = 2.0, BIKE_ROAD = 6.4, BIKE_GRASS = 4.0;      // tiles per second
const NPC_WALK = 1.8, NPC_RIDE = 4.6;
const LEVELS = {
  easy:   { name: '輕鬆', desc: '時間多、車多，只有一個人追你', k: 0.25,  npc: 3, hunters: 1, chase: 1.85, freeze: 1.5, stock: 1,  broken: 0,    rain: 0,    move: false },
  normal: { name: '普通', desc: '會下雨、會借到壞車、會換教室',   k: 0,     npc: 5, hunters: 2, chase: 1.95, freeze: 2,   stock: 0,  broken: 0.15, rain: 0.3,  move: true },
  hard:   { name: '地獄', desc: '時間緊、車少，三個人追你',       k: -0.2,  npc: 9, hunters: 3, chase: 2.2,  freeze: 3,   stock: -1, broken: 0.3,  rain: 0.5,  move: true },
};
let levelKey = 'normal', D = LEVELS.normal;
try { const s = localStorage.getItem('rush-level'); if (LEVELS[s]) { levelKey = s; D = LEVELS[s]; } } catch (_) {}
const H_PATROL = 1.6, DETECT = 4.5, LOSE = 8;
const REACH = 2.0;                                         // station interaction radius (tiles)
const M_PER_TILE = 5;

/* ---------- map ---------- */
const W = 64, H = 40;
const GRASS = 0, ROAD = 1, BLD = 2, DOOR = 3, WATER = 4, TREE = 5, STN = 6;
const grid = new Uint8Array(W * H);
const idx = (x, y) => y * W + x;
const fill = (x, y, w, h, t) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && j >= 0 && i < W && j < H) grid[idx(i, j)] = t; };
const FIELD = 7;
const ROADS = [                                                      // [x, y, w, h], laid out after the NTPU Sanxia campus plan
  [0, 0, 64, 2], [0, 17, 64, 2], [0, 35, 64, 2], [36, 8, 26, 2], [12, 26, 50, 2],
  [1, 0, 2, 37], [12, 0, 2, 37], [22, 0, 2, 37], [36, 0, 2, 37], [44, 0, 2, 37], [52, 0, 2, 37], [60, 0, 2, 37],
];
ROADS.forEach(r => fill(r[0], r[1], r[2], r[3], ROAD));
const FIELDS = [
  { name: '田徑場', x: 4, y: 20, w: 7, h: 8, kind: 'track' },
  { name: '排球場', x: 4, y: 30, w: 7, h: 4, kind: 'court' },
  { name: '棒壘球場', x: 15, y: 20, w: 6, h: 5, kind: 'dirt' },
  { name: '籃球場', x: 46, y: 3, w: 6, h: 4, kind: 'court' },
];
FIELDS.forEach(f => fill(f.x, f.y, f.w, f.h, FIELD));

const BUILDINGS = [
  { id: 'dorm',  name: '學生宿舍',     x: 25, y: 29, w: 5, h: 4, door: [27, 29], color: '#E9C9A8' },
  { id: 'dorm2', name: '第二期宿舍',   x: 25, y: 20, w: 4, h: 4, door: [27, 23], color: '#EBD3B8' },
  { id: 'wood',  name: '木師基地',     x: 27, y: 6,  w: 5, h: 3, door: [29, 8],  color: '#D9C3A0' },
  { id: 'gym',   name: '綜合體育館',   x: 15, y: 29, w: 6, h: 5, door: [18, 29], color: '#F0D58A' },
  { id: 'topco', name: '崇越館',       x: 38, y: 3,  w: 5, h: 4, door: [40, 6],  color: '#C4CBD6' },
  { id: 'hum',   name: '人文大樓',     x: 54, y: 3,  w: 6, h: 4, door: [57, 6],  color: '#D9BFE3' },
  { id: 'soc',   name: '社會科學大樓', x: 38, y: 11, w: 6, h: 5, door: [41, 15], color: '#F2B8A8' },
  { id: 'admin', name: '行政大樓',     x: 46, y: 11, w: 6, h: 5, door: [49, 15], color: '#D8D2C4' },
  { id: 'biz',   name: '商學大樓',     x: 54, y: 11, w: 6, h: 5, door: [57, 15], color: '#E7A08C' },
  { id: 'lib',   name: '圖書資訊大樓', x: 38, y: 20, w: 6, h: 5, door: [41, 20], color: '#B9C6E8' },
  { id: 'eecs',  name: '電機資訊大樓', x: 38, y: 29, w: 6, h: 5, door: [41, 29], color: '#A9D6D2' },
  { id: 'pub',   name: '公共事務大樓', x: 46, y: 29, w: 6, h: 5, door: [49, 29], color: '#C9D8B0' },
  { id: 'law',   name: '法學大樓',     x: 54, y: 29, w: 6, h: 5, door: [57, 29], color: '#C8B8D8' },
];
BUILDINGS.forEach(b => { fill(b.x, b.y, b.w, b.h, BLD); grid[idx(b.door[0], b.door[1])] = DOOR; });
const B = Object.fromEntries(BUILDINGS.map(b => [b.id, b]));
fill(30, 20, 5, 5, WATER);                                             // 心湖

const STATION_DEF = [
  ['大門站', 62, 20, 6, 4], ['大學路站', 62, 12, 4, 2], ['人文站', 55, 7, 3, 2], ['社科站', 39, 16, 4, 2],
  ['圖資站', 43, 19, 5, 3], ['公事站', 51, 28, 4, 2], ['法學站', 59, 28, 3, 1], ['國際二街站', 35, 37, 5, 2],
  ['宿舍站', 32, 28, 6, 5], ['體育館站', 21, 28, 4, 3], ['恩主公站', 3, 34, 4, 2],
];
let stations = [];
STATION_DEF.forEach(s => { grid[idx(s[1], s[2])] = STN; });

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mapRng = mulberry(11);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {           // isolated trees only, so they never wall off a path
  if (grid[idx(x, y)] !== GRASS) continue;
  let clear = true;
  for (let j = -1; j <= 1 && clear; j++) for (let i = -1; i <= 1; i++) {
    const nx = x + i, ny = y + j;
    if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
    if (grid[idx(nx, ny)] !== GRASS) { clear = false; break; }
  }
  if (clear && mapRng() < 0.13) grid[idx(x, y)] = TREE;
}
const solidT = t => t === BLD || t === WATER || t === TREE;
const solid = (x, y) => x < 0 || y < 0 || x >= W || y >= H || solidT(grid[idx(x, y)]);

/* ---------- pathfinding: BFS distance fields ---------- */
function bfs(tx, ty) {
  const f = new Int16Array(W * H).fill(-1), q = new Int32Array(W * H);
  let h = 0, t = 0; f[idx(tx, ty)] = 0; q[t++] = idx(tx, ty);
  while (h < t) {
    const c = q[h++], cx = c % W, cy = (c / W) | 0, d = f[c] + 1;
    if (cx > 0 && f[c - 1] < 0 && !solidT(grid[c - 1])) { f[c - 1] = d; q[t++] = c - 1; }
    if (cx < W - 1 && f[c + 1] < 0 && !solidT(grid[c + 1])) { f[c + 1] = d; q[t++] = c + 1; }
    if (cy > 0 && f[c - W] < 0 && !solidT(grid[c - W])) { f[c - W] = d; q[t++] = c - W; }
    if (cy < H - 1 && f[c + W] < 0 && !solidT(grid[c + W])) { f[c + W] = d; q[t++] = c + W; }
  }
  return f;
}
const fieldCache = new Map();
function field(tx, ty) { const k = idx(tx, ty); let f = fieldCache.get(k); if (!f) { f = bfs(tx, ty); fieldCache.set(k, f); } return f; }

function stepAgent(a, f, speed, dt) {                                 // returns true on arrival
  let rem = speed * dt, guard = 8;
  while (rem > 0 && guard-- > 0) {
    if (a.tx == null) {
      const cx = Math.floor(a.x), cy = Math.floor(a.y), d = f[idx(cx, cy)];
      if (d < 0) return true;
      if (d === 0) { a.tx = cx; a.ty = cy; a.fin = true; }
      else {
        let bx = cx, by = cy, bd = d;
        const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (const [i, j] of nb) { const nx = cx + i, ny = cy + j; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const v = f[idx(nx, ny)]; if (v >= 0 && v < bd) { bd = v; bx = nx; by = ny; } }
        a.tx = bx; a.ty = by; a.fin = false;
      }
    }
    const dx = a.tx + 0.5 - a.x, dy = a.ty + 0.5 - a.y, dist = Math.hypot(dx, dy);
    if (dist > 1e-4) { a.dx = dx / dist; a.dy = dy / dist; }
    if (dist <= rem) { a.x = a.tx + 0.5; a.y = a.ty + 0.5; rem -= dist; a.tx = null; if (a.fin) { a.fin = false; return true; } }
    else { a.x += dx / dist * rem; a.y += dy / dist * rem; rem = 0; }
  }
  return false;
}

/* ---------- game state ---------- */
const CLASSROOMS = { biz: ['會計學', '經濟學', '統計學'], hum: ['大一英文', '文學概論'], law: ['民法總則', '憲法'], pub: ['行政學', '都市計劃'], soc: ['社會學', '社會心理學'], eecs: ['程式設計', '微積分'], lib: ['資訊素養'], gym: ['體育'], wood: ['木工實作'] };
const SLOTS = [['08:10', 1.30], ['09:10', 1.15], ['10:20', 1.10], ['13:20', 1.05], ['15:30', 1.00]];
const ERRANDS = [{ b: 'admin', text: '去行政大樓郵局寄信' }, { b: 'lib', text: '去圖資大樓還書' }, { b: 'dorm', text: '回宿舍拿忘記帶的作業' }, { b: 'topco', text: '去崇越館還球具' }, { b: 'dorm2', text: '去二期宿舍找同學拿筆記' }];
let SCHEDULE = [];
const doorDist = (a, b) => field(B[a].door[0], B[a].door[1])[idx(B[b].door[0], B[b].door[1])];
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function buildSchedule() {                                             // a new random timetable every run
  const ids = Object.keys(CLASSROOMS); let order = [];
  for (let tries = 0; tries < 200; tries++) {
    order = shuffled(ids).slice(0, SLOTS.length);
    let ok = doorDist('dorm', order[0]) >= 22;
    for (let i = 1; i < order.length && ok; i++) ok = doorDist(order[i - 1], order[i]) >= 22;
    if (ok) break;
  }
  const pool = shuffled(ERRANDS).map(e => ({ ...e }));
  SCHEDULE = order.map((b, i) => {
    const c = { t: SLOTS[i][0], k: SLOTS[i][1], b, course: pick(CLASSROOMS[b]) }, prev = i ? order[i - 1] : 'dorm';
    if (i === 0) { if (b !== 'biz') c.errand = { b: 'biz', text: '去商學大樓全家買早餐', perk: 'boost' }; }
    else if (i === 2) { const near = ids.filter(x => x !== b && x !== prev).sort((p, q) => doorDist(b, p) - doorDist(b, q))[0]; c.move = { to: near, extra: 4 }; }
    else if (i !== 4) { const e = pool.find(e => e.b !== b && e.b !== prev && !e.used); if (e) { e.used = true; c.errand = { b: e.b, text: e.text }; } }
    return c;
  });

    const u = Math.max(8, ts * 0.3), g = 3, bw = s.cap * u + (s.cap - 1) * g + 10, bx = cx - bw / 2, by = ty - u - 16;
    ctx.fillStyle = 'rgba(28,37,48,.9)'; ctx.beginPath(); ctx.roundRect(bx, by, bw, u + 10, 5); ctx.fill();
    for (let i = 0; i < s.cap; i++) { const sx = bx + 5 + i * (u + g); if (i < s.bikes) { ctx.fillStyle = C.bike; ctx.fillRect(sx, by + 5, u, u); } else { ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5; ctx.strokeRect(sx + 0.75, by + 5.75, u - 1.5, u - 1.5); } }
    label(s.name, cx, ty + ts * 1.32, Math.max(10, ts * 0.36), C.white, C.ink);
  }

  npcs.forEach(n => person(n, 0.22, n.color, C.ink));
  for (const h of hunters) {
    if (h.cool <= 0 || h.mode === 'chase') { ctx.fillStyle = h.mode === 'chase' ? 'rgba(214,51,75,.2)' : 'rgba(214,51,75,.1)'; ctx.beginPath(); ctx.arc(SX(h.x), SY(h.y), DETECT * ts, 0, 7); ctx.fill(); }
    person(h, 0.3, C.hunter, C.ink);
    ctx.fillStyle = C.white; ctx.fillRect(SX(h.x) - ts * 0.13, SY(h.y) - ts * 0.16, ts * 0.26, ts * 0.32);
    label(h.mode === 'chase' ? '同學等一下！' : h.tag, SX(h.x), SY(h.y) - ts * 0.72, Math.max(10, ts * 0.36), C.white, C.hunter);
  }
  person(P, 0.3, C.player, C.white);
  if (P.frozen > 0) label('填問卷中 ' + P.frozen.toFixed(1), SX(P.x), SY(P.y) - ts * 0.8, Math.max(11, ts * 0.4), C.white, C.ink);

  if (target) {                                                        // edge arrow when the classroom is off-screen
    const tx = SX(target.door[0] + 0.5), ty = SY(target.door[1] + 0.5), m = 34;
    if (tx < m || ty < m || tx > cw - m || ty > ch - m) {
      const px = SX(P.x), py = SY(P.y), ang = Math.atan2(ty - py, tx - px);
      let k = Infinity; const vx = Math.cos(ang), vy = Math.sin(ang);
      if (vx > 0) k = Math.min(k, (cw - m - px) / vx); else if (vx < 0) k = Math.min(k, (m - px) / vx);
      if (vy > 0) k = Math.min(k, (ch - m - py) / vy); else if (vy < 0) k = Math.min(k, (m - py) / vy);
      const ax = px + vx * k, ay = py + vy * k;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang); ctx.fillStyle = C.bike; ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      const dist = Math.round(Math.hypot(target.door[0] + 0.5 - P.x, target.door[1] + 0.5 - P.y) * M_PER_TILE);
      label(dist + ' m', ax - vx * 30, ay - vy * 30, 13, C.white, C.ink);
    }
  }

  if (rain && state === 'play') {
    ctx.fillStyle = 'rgba(40,70,110,.2)'; ctx.fillRect(0, 0, cw, ch); ctx.strokeStyle = 'rgba(235,245,255,.5)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i < 80; i++) { const ry = (i * 71.3 + clock * 620) % (ch + 40) - 20, rx = (i * 137.5) % (cw + 200) - ry * 0.3; ctx.moveTo(rx, ry); ctx.lineTo(rx - 5, ry + 15); }
    ctx.stroke();
  }
  const ms = cw < 600 ? 2 : 2.5, mw = W * ms, mh = H * ms, mx = cw - mw - 10, my = 10;   // minimap
  ctx.fillStyle = 'rgba(28,37,48,.9)'; ctx.fillRect(mx - 3, my - 3, mw + 6, mh + 6);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(mini, mx, my, mw, mh); ctx.imageSmoothingEnabled = true;
  const dot = (x, y, r, col, ring) => { ctx.beginPath(); ctx.arc(mx + x * ms, my + y * ms, r, 0, 7); ctx.fillStyle = col; ctx.fill(); if (ring) { ctx.lineWidth = 1.5; ctx.strokeStyle = ring; ctx.stroke(); } };
  for (const s of stations) { const useful = P.riding ? s.bikes < s.cap : s.bikes > 0; dot(s.x + 0.5, s.y + 0.5, 3, useful ? C.bike : '#6B7480', C.ink); }
  hunters.forEach(h => dot(h.x, h.y, 2.5, C.hunter));
  if (eb) dot(eb.door[0] + 0.5, eb.door[1] + 0.5, 3.5, C.errand, C.ink);
  if (target) { const p = 0.5 + 0.5 * Math.sin(clock * 6); ctx.strokeStyle = C.white; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mx + (target.door[0] + 0.5) * ms, my + (target.door[1] + 0.5) * ms, 4 + p * 3, 0, 7); ctx.stroke(); }
  dot(P.x, P.y, 3.5, C.player, C.white);

  if (joy && joy.on) { ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 34, 0, 7); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(joy.ox + joy.dx * 34, joy.oy + joy.dy * 34, 14, 0, 7); ctx.fill(); }
}

/* ---------- input ---------- */
const MOVE = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (state !== 'play') { if (e.code === 'Enter') { e.preventDefault(); startGame(); } return; }
  if (MOVE.has(e.code)) { keys.add(e.code); e.preventDefault(); }
  else if (e.code === 'KeyE' || e.code === 'Space') { e.preventDefault(); if (!e.repeat) interact(); }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
$c.addEventListener('pointerdown', e => { const r = $c.getBoundingClientRect(); joy = { id: e.pointerId, ox: e.clientX - r.left, oy: e.clientY - r.top, dx: 0, dy: 0, on: false }; try { $c.setPointerCapture(e.pointerId); } catch (_) {} });
$c.addEventListener('pointermove', e => { if (!joy || joy.id !== e.pointerId) return; const r = $c.getBoundingClientRect(); const dx = e.clientX - r.left - joy.ox, dy = e.clientY - r.top - joy.oy, d = Math.hypot(dx, dy); if (d > 8) { joy.on = true; joy.dx = dx / d; joy.dy = dy / d; } else joy.on = false; });
const endJoy = e => { if (joy && joy.id === e.pointerId) joy = null; };
$c.addEventListener('pointerup', endJoy); $c.addEventListener('pointercancel', endJoy);
$act.addEventListener('click', () => { interact(); $act.blur(); });
$overlay.addEventListener('click', e => {
  const lv = e.target.closest('.lv');
  if (lv) { levelKey = lv.dataset.lv; try { localStorage.setItem('rush-level', levelKey); } catch (_) {} $card.querySelectorAll('.lv').forEach(x => x.setAttribute('aria-checked', String(x === lv))); return; }
  if (e.target.id === 'go') startGame();
});

/* ---------- boot ---------- */
$card.innerHTML = '<h2>下課只有二十幾秒，教室在校園另一頭</h2><ul><li>用走的很勉強，借 YouBike 才穩。</li><li>進教室前，車得還進<strong>有空位</strong>的站。</li><li>其他學生也在借車還車，車位隨時在變。</li><li>拿問卷的學長姐看到你會追上來，被攔下會卡住幾秒。</li><li>藍色門口是順路任務（買早餐、還書），繞過去有加分。</li></ul><p class="sub">一天 5 堂課，先選難度：</p>' + levelPicker() + '<button class="btn" id="go" type="button">開始第一堂課</button>';
reset(); renderPips(); resize();
let last = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; update(dt); renderHud(); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
})();
</script>
</body>
